version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: seace_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seace_db}
      POSTGRES_USER: ${POSTGRES_USER:-seace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seace_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: seace_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: seace_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  etl:
    build: ./etl
    container_name: seace_etl
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./etl:/app
    profiles:
      - etl

volumes:
  postgres_data:
